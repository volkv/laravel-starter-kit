[www]
user = appuser
group = appuser
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 1000

; Logging
access.log = /var/log/php/access.log
slowlog = /var/log/php/slow.log
request_slowlog_timeout = 10s

; Catch workers output
catch_workers_output = yes
decorate_workers_output = no

; Per-request memory cap for web workers only (php.ini memory_limit stays the CLI value for
; imports and artisan). Fleet hosts are shared: songsense runs ~16 projects in 7.7 GB with under
; 500 MB free at peak, so a runaway request must hit its own ceiling, not the host's.
php_admin_value[memory_limit] = 256M
